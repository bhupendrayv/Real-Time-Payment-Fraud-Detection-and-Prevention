services:
  # ── FraudShield Backend API ──────────────────────────────────────────
  - type: web
    name: fraudshield-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-postgres
          property: connectionString
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_VERSION
        value: xgb-v1
      - key: RATE_LIMIT_PER_MINUTE
        value: 120/minute
      - key: CORS_ORIGINS
        # Update this to your deployed Vercel frontend URL once deployed
        value: "http://localhost:5173,http://localhost:3000,https://fraudshield-frontend.vercel.app"

databases:
  # ── Managed PostgreSQL ───────────────────────────────────────────────
  - name: fraudshield-postgres
    plan: free
    region: oregon
    databaseName: fraudshield_db
    user: fraudshield
