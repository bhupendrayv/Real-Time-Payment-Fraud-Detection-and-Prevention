# Ruff configuration
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module level import not at top of file
]
exclude = [
    ".git",
    ".pytest_cache",
    "venv",
    ".venv",
    "node_modules",
    "notebooks",
]
